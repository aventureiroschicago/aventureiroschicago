<text x="200" y="390" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#12294d">MENINA</text>
<text x="200" y="412" text-anchor="middle" font-family="Arial" font-size="13" fill="#42566a">Blusa branca, saia azul-marinho</text>
