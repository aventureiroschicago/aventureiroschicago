<rect width="900" height="480" fill="#fffdf5"/>
<text x="450" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#12294d">Os dois lenços do Aventureiro nos EUA</text>
