<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
<defs>
<linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#a8dcf5"/><stop offset="50%" stop-color="#7ec3e8"/><stop offset="100%" stop-color="#5aa8d6"/>
</linearGradient>
<linearGradient id="wineGrad" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#a03a5e"/><stop offset="50%" stop-color="#7a1f3d"/><stop offset="100%" stop-color="#5e142e"/>
</linearGradient>
<linearGradient id="fold" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
